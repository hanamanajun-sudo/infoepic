<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>infoepic 관리자</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
  </style>
</head>
<body>
  <!-- 관리자 목록 기본 정렬: pubDate 내림차순 (최신순) — 사이트와 동일하게 -->
  <script>
    (function () {
      var SORT_KEY = 'decap-cms.entries.sort';
      try {
        var current = localStorage.getItem(SORT_KEY);
        // 사용자가 수동으로 바꾼 적 없을 때만 기본값 주입
        if (!current) {
          localStorage.setItem(SORT_KEY, JSON.stringify({
            blog: { pubDate: { key: 'pubDate', direction: 'Descending', index: 0 } }
          }));
        }
      } catch (e) { /* localStorage 차단 환경 무시 */ }
    })();
  </script>

  <!-- decap-cms.js는 빌드 시 node_modules에서 복사됨 (npm run copy-cms) -->
  <script src="/admin/decap-cms.js"></script>

  <script>
    // ─────────────────────────────────────────────
    // 1. 구분선 — 실선
    // ─────────────────────────────────────────────
    CMS.registerEditorComponent({
      id: 'hr-solid',
      label: '구분선 ─ 실선',
      fields: [],
      pattern: /^<hr class="hr-solid">$/m,
      fromBlock: () => ({}),
      toBlock: () => '<hr class="hr-solid">',
      toPreview: () => '<hr style="border:none;border-top:2px solid #e2e8f0;margin:2rem 0;">',
    });

    // ─────────────────────────────────────────────
    // 2. 구분선 — 점선
    // ─────────────────────────────────────────────
    CMS.registerEditorComponent({
      id: 'hr-dashed',
      label: '구분선 ┄ 점선',
      fields: [],
      pattern: /^<hr class="hr-dashed">$/m,
      fromBlock: () => ({}),
      toBlock: () => '<hr class="hr-dashed">',
      toPreview: () => '<hr style="border:none;border-top:2px dashed #cbd5e1;margin:2rem 0;">',
    });

    // ─────────────────────────────────────────────
    // 3. 구분선 — 굵은 실선
    // ─────────────────────────────────────────────
    CMS.registerEditorComponent({
      id: 'hr-thick',
      label: '구분선 ━ 굵은선',
      fields: [],
      pattern: /^<hr class="hr-thick">$/m,
      fromBlock: () => ({}),
      toBlock: () => '<hr class="hr-thick">',
      toPreview: () => '<hr style="border:none;border-top:4px solid #94a3b8;margin:2rem 0;">',
    });

    // ─────────────────────────────────────────────
    // 4. 텍스트 색상
    // ─────────────────────────────────────────────
    CMS.registerEditorComponent({
      id: 'text-color',
      label: '텍스트 색상',
      fields: [
        {
          name: 'text',
          label: '텍스트 내용',
          widget: 'string',
        },
        {
          name: 'color',
          label: '색상 선택',
          widget: 'select',
          options: [
            { label: '🔴 빨강',   value: '#ef4444' },
            { label: '🟠 주황',   value: '#f97316' },
            { label: '🟡 노랑',   value: '#eab308' },
            { label: '🟢 초록',   value: '#22c55e' },
            { label: '🔵 파랑',   value: '#3b82f6' },
            { label: '🟣 보라',   value: '#a855f7' },
            { label: '⚫ 회색',   value: '#64748b' },
            { label: '🩷 핑크',   value: '#ec4899' },
          ],
        },
      ],
      pattern: /<span data-color style="color:(#[0-9a-fA-F]{6})">([\s\S]*?)<\/span>/,
      fromBlock: (match) => ({ color: match[1], text: match[2] }),
      toBlock: ({ text, color }) =>
        `<span data-color style="color:${color}">${text || '텍스트를 입력하세요'}</span>`,
      toPreview: ({ text, color }) =>
        `<span style="color:${color}">${text || '텍스트를 입력하세요'}</span>`,
    });

    // ─────────────────────────────────────────────
    // 5. 새 탭에서 열기 링크
    // ─────────────────────────────────────────────
    CMS.registerEditorComponent({
      id: 'link-new-tab',
      label: '🔗 새 탭 링크',
      fields: [
        {
          name: 'text',
          label: '링크 텍스트',
          widget: 'string',
        },
        {
          name: 'url',
          label: 'URL',
          widget: 'string',
        },
      ],
      pattern: /<a href="([^"]+)" target="_blank" rel="noopener noreferrer">([\s\S]*?)<\/a>/,
      fromBlock: (match) => ({ url: match[1], text: match[2] }),
      toBlock: ({ text, url }) =>
        `<a href="${url || '#'}" target="_blank" rel="noopener noreferrer">${text || url || '링크'}</a>`,
      toPreview: ({ text, url }) =>
        `<a href="${url || '#'}" target="_blank" rel="noopener noreferrer" style="color:#3b82f6;">${text || url || '링크'}</a>`,
    });

    // ─────────────────────────────────────────────
    // 6. 텍스트 크기
    // ─────────────────────────────────────────────
    CMS.registerEditorComponent({
      id: 'text-size',
      label: '텍스트 크기',
      fields: [
        {
          name: 'text',
          label: '텍스트 내용',
          widget: 'string',
        },
        {
          name: 'size',
          label: '크기 선택',
          widget: 'select',
          options: [
            { label: '소 — 14px',  value: '0.875rem' },
            { label: '중 — 18px',  value: '1.125rem' },
            { label: '대 — 20px',  value: '1.25rem'  },
            { label: '특대 — 24px', value: '1.5rem'  },
          ],
        },
      ],
      pattern: /<span data-size style="font-size:([\d.]+rem)">([\s\S]*?)<\/span>/,
      fromBlock: (match) => ({ size: match[1], text: match[2] }),
      toBlock: ({ text, size }) =>
        `<span data-size style="font-size:${size}">${text || '텍스트를 입력하세요'}</span>`,
      toPreview: ({ text, size }) =>
        `<span style="font-size:${size}">${text || '텍스트를 입력하세요'}</span>`,
    });
  </script>
</body>
</html>
